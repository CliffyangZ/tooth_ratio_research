[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tooth-ratio"
version = "0.1.0"
description = "Tools for processing and comparing tooth images"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "scikit-image==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
packages = []
